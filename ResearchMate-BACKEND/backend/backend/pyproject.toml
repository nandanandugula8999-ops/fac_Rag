[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "faculty-radar"
version = "0.1.0"
description = "Faculty Research Discovery Assistant - research intelligence engine over consented faculty research data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# Neural embeddings. Heavy (pulls torch); only needed if you do not want to
# run with the default offline `hashing` embedder.
embeddings = [
    "sentence-transformers>=3.0",
]
# Demo web prototype only: FastAPI wrapper around the existing RagPipeline plus
# a dev server. The RAG itself has no web dependency.
demo = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
fr = "faculty_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faculty_radar = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires network access or external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Fixture payloads are inline JSON-like literals; one author/work per line is
# the point, so line length is not a meaningful constraint there.
"tests/fake_openalex.py" = ["E501"]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["faculty_radar"]
